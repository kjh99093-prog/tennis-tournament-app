
name: AURA Tournament Data Update

on:
  push:
    paths:
      - 'scripts/fetch_public_events.py'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '0 16 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tournaments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch public tournament listings
        run: python scripts/fetch_public_events.py

     
      - name: Show collection results
        run: |
          python -c "import json; d=json.load(open('public/data/tournaments.json')); print('Valid tournaments:', len(d.get('events', []))); [print(s.get('name','Unknown'), s.get('status','unknown'), s.get('eventsCount',0)) for s in d.get('sources', [])]"

      - name: Save updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tournaments.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public tournament listings"
            git push
          else
            echo "No changes to tournament data."
          fi
